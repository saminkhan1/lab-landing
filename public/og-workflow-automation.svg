<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">One workflow across browser, desktop, and APIs</title>
  <desc id="desc">Wexpro records one real cross-platform process, turns it into a draft to review and approve, and runs the approved workflow again.</desc>
  <rect width="1200" height="630" fill="#fcfbfa"/>
  <path d="M0 82h1200M48 530h1104" fill="none" stroke="#e6e1e3"/>
  <text x="48" y="51" fill="#171718" font-family="IBM Plex Mono, Courier New, monospace" font-size="20" font-weight="500" letter-spacing="4">WEXPRO LABS</text>
  <text x="48" y="168" fill="#171718" font-family="Georgia, serif" font-size="54" letter-spacing="-2">One recorded workflow,</text>
  <text x="48" y="226" fill="#171718" font-family="Georgia, serif" font-size="54" letter-spacing="-2">across every system it touches.</text>
  <text x="50" y="290" fill="#716e70" font-family="Inter, Arial, sans-serif" font-size="20">Browser tabs · desktop apps · files · connected APIs</text>
  <text x="50" y="322" fill="#716e70" font-family="Inter, Arial, sans-serif" font-size="20">Review the draft. Add human checkpoints. Run it again.</text>
  <g transform="translate(48 382)" font-family="IBM Plex Mono, monospace">
    <g><rect width="344" height="96" fill="#fff" stroke="#cbc5c8"/><text x="18" y="29" fill="#692fff" font-size="13">01 / RECORD</text><text x="18" y="59" fill="#171718" font-size="15">Perform one real workflow</text><text x="18" y="80" fill="#716e70" font-size="11">Browser → file → API → desktop</text></g>
    <g transform="translate(368)"><rect width="344" height="96" fill="#fff" stroke="#cbc5c8"/><text x="18" y="29" fill="#692fff" font-size="13">02 / REVIEW &amp; APPROVE</text><text x="18" y="59" fill="#171718" font-size="15">Inspect the workflow draft</text><text x="18" y="80" fill="#716e70" font-size="11">Steps · checks · exceptions</text></g>
    <g transform="translate(736)"><rect width="344" height="96" fill="#fff" stroke="#cbc5c8"/><text x="18" y="29" fill="#692fff" font-size="13">03 / RUN</text><text x="18" y="59" fill="#171718" font-size="15">Trigger the approved workflow</text><text x="18" y="80" fill="#716e70" font-size="11">UI · schedule · API event · evidence</text></g>
  </g>
  <text x="48" y="578" fill="#716e70" font-family="IBM Plex Mono, monospace" font-size="12" letter-spacing="2">RECORD · REVIEW &amp; APPROVE · RUN</text>
  <g transform="translate(907 552)"><rect width="245" height="44" fill="#692fff"/><text x="122" y="28" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="middle">Book a workflow mapping</text></g>
</svg>
