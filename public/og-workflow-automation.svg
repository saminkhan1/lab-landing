<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Wexpro Labs recorded workflow helpers</title>
  <desc id="desc">A run sheet style preview for recording repeated computer work and replaying it with review.</desc>
  <rect width="1200" height="630" fill="#f5f8f2"/>
  <path d="M0 0h1200v630H0z" fill="url(#grid)"/>
  <defs>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0v72" fill="none" stroke="#15130e" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="70" y="64" width="1060" height="502" fill="#fffdf7" stroke="#15130e" stroke-width="3"/>
  <rect x="88" y="82" width="1024" height="78" fill="#fff6dd" stroke="#15130e" stroke-width="2"/>
  <text x="112" y="132" fill="#15130e" font-family="Arial Narrow, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="1">WEXPRO LABS</text>
  <text x="830" y="132" fill="#087a57" font-family="Courier New, monospace" font-size="22" font-weight="700">RECORD ONCE</text>
  <text x="112" y="245" fill="#15130e" font-family="Georgia, serif" font-size="68" font-weight="500">Record the task once.</text>
  <text x="112" y="310" fill="#36342d" font-family="Georgia, serif" font-size="34">We learn how to do it again, with checks,</text>
  <text x="112" y="354" fill="#36342d" font-family="Georgia, serif" font-size="34">approval gates, and a replay log.</text>
  <g transform="translate(112 420)">
    <rect width="976" height="84" fill="#e8efe2" stroke="#15130e" stroke-width="2"/>
    <path d="M0 42h976" stroke="#15130e" stroke-opacity=".45" stroke-width="1"/>
    <path d="M235 0v84M470 0v84M705 0v84" stroke="#15130e" stroke-width="2"/>
    <text x="22" y="31" fill="#6c7167" font-family="Courier New, monospace" font-size="18">record</text>
    <text x="257" y="31" fill="#6c7167" font-family="Courier New, monospace" font-size="18">learn</text>
    <text x="492" y="31" fill="#6c7167" font-family="Courier New, monospace" font-size="18">replay</text>
    <text x="727" y="31" fill="#6c7167" font-family="Courier New, monospace" font-size="18">review</text>
    <text x="22" y="67" fill="#15130e" font-family="Arial Narrow, Arial, sans-serif" font-size="23" font-weight="700">DO THE TASK</text>
    <text x="257" y="67" fill="#15130e" font-family="Arial Narrow, Arial, sans-serif" font-size="23" font-weight="700">CAPTURE STEPS</text>
    <text x="492" y="67" fill="#15130e" font-family="Arial Narrow, Arial, sans-serif" font-size="23" font-weight="700">RUN AGAIN</text>
    <text x="727" y="67" fill="#15130e" font-family="Arial Narrow, Arial, sans-serif" font-size="23" font-weight="700">PAUSE TO APPROVE</text>
  </g>
  <rect x="1005" y="92" width="82" height="44" fill="none" stroke="#087a57" stroke-width="4" transform="rotate(-4 1046 114)"/>
  <text x="1011" y="120" fill="#087a57" font-family="Courier New, monospace" font-size="18" font-weight="700" transform="rotate(-4 1046 114)">REPLAY</text>
</svg>
