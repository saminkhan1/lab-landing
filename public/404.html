<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Not found | Wexpro Labs</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f7f7f3">
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f7f3;
      --ink: #11110f;
      --muted: #55534d;
      --line: #11110f;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--paper);
      color: var(--ink);
      font: 18px/1.45 Georgia, serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 540px);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 28px 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.6rem, 12vw, 5rem);
      font-weight: 400;
      line-height: 1;
    }

    p {
      margin: 18px 0 0;
      color: var(--muted);
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 24px;
      font: 0.78rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      text-transform: lowercase;
    }

    a {
      color: inherit;
      text-underline-offset: 0.24em;
    }

    a:focus-visible {
      outline: 1px solid var(--ink);
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Not found.</h1>
    <p>This site only publishes the Wexpro Labs overview and the Hermes Pet for macOS page.</p>
    <nav aria-label="Available pages">
      <a href="/">Wexpro Labs</a>
      <a href="/agent-ui/">Hermes Pet for macOS</a>
    </nav>
  </main>
</body>
</html>
